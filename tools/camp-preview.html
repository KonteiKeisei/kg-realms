<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KG Realms camp carousel preview</title>
  <link rel="stylesheet" href="../styles/realms.css">
<link rel="stylesheet" href="../styles/glass.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px "Segoe UI", sans-serif; background: #526152; }
    #board { position: fixed; inset: 0; background: linear-gradient(25deg,#4c5a4b,#7b8467); }
    #preview-controls { position: relative; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: #202328; color: #f4f4f4; }
    #preview-controls label { display: flex; gap: 6px; align-items: center; }
    #choice { position: fixed; top: 74px; left: 20px; width: min(400px,calc(100vw - 40px)); max-height: calc(100vh - 94px); overflow: auto; padding: 14px; background: var(--kgr-panel); border: 1px solid var(--kgr-line-2); border-radius: 10px; }
    .kgr-ui button, .kgr-ui input, .kgr-ui select { font: inherit; color: var(--kgr-text); background: var(--kgr-input); border: 1px solid var(--kgr-line-2); border-radius: 5px; padding: 5px 7px; }
    .kgr-ui button { cursor: pointer; }
    .kgr-ui button.primary { background: var(--kgr-accent); color: var(--kgr-gold-ink); }
    .kgr-ui h4 { border: 0; }
    .kgr-ui .grow, .kgr-ui .sp { flex: 1; }
    .kgr-ui .hint { color: var(--kgr-muted-2); }
    #errors { position: fixed; top: 60px; right: 10px; color: #fff; background: #8b2929; z-index: 20; }
  </style>
</head>
<body class="kgr-theme-travel">
  <div id="board"></div>
  <div id="preview-controls">
    <label>Theme <select id="theme"><option value="travel">Chocolate</option><option value="oxblood">Oxblood</option><option value="royal">Royal Blue</option><option value="emerald">Emerald</option><option value="amethyst">Amethyst</option><option value="iron">Iron</option><option value="holy">Holy White</option></select></label>
    <label>Screen <select id="screen"><option value="choice">Rest choice</option><option value="tasks">Task setup</option><option value="watches">Watch setup</option><option value="night-setup">Night setup</option><option value="camp">Camp</option><option value="forage">Forage rolls</option><option value="conceal">Conceal rolls</option><option value="w0">Shared watch</option><option value="encounter">Encounter check</option><option value="recovery">Rest complete</option><option value="wait">Extra waiting (20 h camp)</option><option value="pack">Packing</option><option value="banner">Watch notification</option></select></label>
    <label><input id="player" type="checkbox"> Player view</label>
  </div>
  <div id="choice" class="kgr-ui kgr-camp-box"></div>
  <pre id="errors" hidden></pre>
  <script type="module">
    const errors = document.getElementById("errors");
    window.addEventListener("error", (e) => { errors.hidden = false; errors.textContent += `${e.message}\n`; });
    window.addEventListener("unhandledrejection", (e) => { errors.hidden = false; errors.textContent += `${e.reason?.stack ?? e.reason}\n`; });
    globalThis.foundry = { utils: {
      escapeHTML: (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]),
      deepClone: structuredClone, getRoute: (s) => s, randomID: () => crypto.randomUUID(), isNewerVersion: () => true
    } };
    const settings = { advancedWatches: true, taskForage: true, taskConceal: true, taskAlarm: true };
    const actors = ["Othorion Baenre", "Kavu", "Borin", "Cira", "Tamsin"].map((name,i) => ({ id:`a${i}`, name, img:`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#59616a"/><text x="40" y="52" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#fff">${name[0]}</text></svg>`)}`, isOwner:true, items:[], system:{skills:{prc:{passive:14,total:4},sur:{total:5},ste:{total:3},slt:{total:2}}}, testUserPermission:()=>true }));
    const users = [{ id:"gm", name:"Preview GM", isGM:true, active:true }];
    globalThis.game = {
      user: { id:"gm", isGM:true, active:true }, users, actors:{get:(id)=>actors.find((a)=>a.id===id)}, scenes:{get:()=>null}, messages:new Map(),
      system:{version:"5.3.3"}, modules:{get:(id)=>({active:id==="rest-recovery"})}, settings:{get:(m,k)=>settings[k]},
      restrecovery:{getActiveProfile:()=>"Wilderness",promptRest:()=>true},
      time:{ worldTime:18*3600,calendar:{timeToComponents:(t)=>({year:1492,month:3,dayOfMonth:Math.floor(t/86400),hour:Math.floor(t/3600)%24,minute:0})} }
    };
    globalThis.ui = { notifications:{warn:console.warn,info:console.info} };
    globalThis.canvas = { scene:{id:"preview"} };
    globalThis.ChatMessage = {create:()=>{}};
    const { campPhases } = await import("../scripts/camp.mjs");
    const { CampPanel, showBanner } = await import("../scripts/ui-camp.mjs");
    const state = { rest:16, name:"Coast road", encounters:[],trip:{resumed:{}},watch:{order:actors.map((a)=>a.id),hours:{a0:2,a1:4,a2:4},join:{a1:true},tasks:{a0:"watch",a1:"watch",a2:"watch",a3:"forage",a4:"forage"},setup:null,checks:{night:1,forage:{dc:15,leader:"a3",asked:1,rolls:{a3:{total:17,skill:"sur"},a4:{total:12,skill:"sur"}}}},scene:{night:1,step:"camp"}} };
    const { travelRules } = await import("../scripts/travel-rules.mjs");
    const R = travelRules();
    let progress;
    state.watch.campId = state.watch.checks.campId = state.watch.checks.forage.campId = "preview-camp";
    state.watch.phases = { ...campPhases(16), campId: "preview-camp" };
    state.watch.checks.forage.requests = { a3:"preview-a3", a4:"preview-a4" };
    const hud = { state,clock:game.time.worldTime,leader:true,members:()=>actors,ruleText:()=>R,progress:()=>progress,save:async(changes)=>{Object.assign(state,changes);render();},render:()=>render() };
    const camp = new CampPanel(hud);
    hud.save = async (changes) => {
      for (const [path, value] of Object.entries(changes)) {
        const keys=path.split(".");let at=state;
        for (const key of keys.slice(0,-1)) at=at[key]??={};
        at[keys.at(-1)]=value;
      }
      render();
    };
    hud.scene = canvas.scene;
    hud.scene.getFlag = (scope,key) => key === "journey" ? state : undefined;
    game.scenes.get = (id) => id === hud.scene.id ? hud.scene : null;
    hud.scene.update = async (changes) => {
      for (const [path,value] of Object.entries(changes)) {
        const keys=path.replace(/^flags\.kg-realms\.journey\./, "").split(".");let at=state;
        for (const key of keys.slice(0,-1)) at=at[key]??={};
        const last=keys.at(-1);if(last.startsWith("-="))delete at[last.slice(2)];else at[last]=value;
      }
      render();
    };
    hud.advanceClock=async(seconds)=>{game.time.worldTime+=seconds;hud.clock=game.time.worldTime;render();};
    globalThis.Roll=class{constructor(formula){this.sides=Number(formula.split('d')[1]);}async evaluate(){return {total:Math.min(this.sides,window.previewDie??2)};}};
    for (const actor of actors) actor.rollSkill=async(config,dialog,message)=>{
      const msg={id:crypto.randomUUID(),speaker:{actor:actor.id},flags:message.data.flags,rolls:[{total:17}]};
      game.messages.set(msg.id,msg);await camp.onRoll(msg);return msg.rolls;
    };
    const choice = document.getElementById("choice");
    function draw() {
      const screen = document.getElementById("screen").value;
      document.querySelector(".kgr-watch-banner")?.remove();
      game.user.isGM = !document.getElementById("player").checked;
      document.body.className = `kgr-theme-${document.getElementById("theme").value}`;
      if(screen==="banner") {
        camp.renderScene(null);choice.hidden=true;
        showBanner({name:"Othorion and Kavu",img:actors[0].img,n:1,total:2,when:"02:00 to 06:00",line:"The camp settles. The others sleep.",ticks:["02:00","04:00","06:00","08:00","10:00"],parts:[{name:"Othorion & Kavu",hours:4,colour:"#d9a441"},{name:"Borin",hours:4,colour:"#9fe1ff"}],cur:0});
        return;
      }
      const making = ["choice","tasks","watches","night-setup"].includes(screen);
      state.rest=screen==="wait"?20:16;
      state.watch.phases={...campPhases(state.rest),campId:state.watch.campId};
      game.time.worldTime=(screen==="w0"?22:screen==="encounter"?23:["recovery","wait","pack"].includes(screen)?30:18)*3600;
      hud.clock=game.time.worldTime;
      (state.watch.checks.forage??={campId:state.watch.campId}).asked=making?null:1;
      progress = { status:making?"decide":"resting", night:1, dayHours:8,limit:8,since:18*3600,until:(18+state.rest)*3600 };
      state.watch.setup = screen==="choice"?null:1;
      camp.setupView = screen==="night-setup"?"night":screen;
      state.watch.scene = making ? null : {night:1,step:screen==="encounter"?"w0":screen,hold:false};
      if(screen==="encounter") {
        const e={id:"night-enc",name:"Wolves beyond the firelight",dc:15,rest:{night:1,at:5,watch:0}};
        state.encounters=[e]; progress={...progress,status:"encounter",camp:true,campStart:18*3600,since:23*3600,encounter:e};
      } else state.encounters=[];
      render();
    }
    function render() {
      const making=progress.status==="decide";
      camp.renderScene(making?null:progress);
      choice.hidden=!making;
      choice.innerHTML=making?camp.html(progress):"";
      window.previewReady=true;
    }
    document.querySelectorAll("#preview-controls input,#preview-controls select").forEach((el)=>el.addEventListener("change",draw));
    choice.addEventListener("click",(e)=>{const b=e.target.closest("button[data-camp]");if(b)camp.click(b);});
    choice.addEventListener("change",(e)=>{if(e.target.dataset.camp)camp.change(e.target);});
    draw();
    window.campPreview={camp,state,hud,draw};
  </script>
</body>
</html>
