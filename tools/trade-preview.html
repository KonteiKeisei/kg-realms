<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KG Realms trade card preview</title><link rel="stylesheet" href="../styles/realms.css"><style>
*{box-sizing:border-box}body{margin:0;background:#4e5b53;font:14px "Segoe UI",sans-serif}#controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:12px;background:#191d22;color:#eee;position:relative;z-index:30}#controls label{display:flex;gap:6px;align-items:center}#controls select{padding:5px}.application{position:absolute;left:50%;top:90px;transform:translateX(-50%);max-width:calc(100vw - 22px);border-radius:10px;box-shadow:0 10px 35px #0008}.window-header{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px 10px 0 0}.window-title{flex:1;font:inherit;margin:0;border:0}.window-content{border-radius:0 0 10px 10px}.application.kgr-trade-editor{z-index:20;top:78px}.application .kgc-foot button{font:inherit;min-height:34px}#errors{position:fixed;bottom:0;background:#600;color:#fff;z-index:50;max-width:100vw}#tooltip{position:fixed;z-index:100;max-width:320px;padding:12px;background:#11151b;color:#eee;border:1px solid #68727e;border-radius:6px;pointer-events:none;font:13px/1.5 "Segoe UI"}#tooltip p{margin:5px 0}
</style><body class="kgr-theme-iron"><div id="controls"><label>Place<select id="place"><option>Neverwinter</option><option>Phandalin</option><option>Waterdeep</option></select></label><label>Prices<select id="scale"><option>x1</option><option>x2</option><option>x5</option><option>d2</option><option>d10</option></select></label><label>Theme<select id="theme"><option>iron</option><option>travel</option><option>holy</option><option>oxblood</option><option>royal</option><option>emerald</option><option>amethyst</option></select></label><label><input id="player" type="checkbox"> Player</label></div><pre id="errors"></pre><div id="tooltip" hidden></div><script type="module">
import {PlaceCard as HoverCard} from '../scripts/ui-card.mjs';import {openTradeEditor} from '../scripts/ui-trade.mjs';import {PlaceCards} from '../scripts/place-card.mjs';import {registerKinds} from '../scripts/card-kinds.mjs';import {TradeMarkets} from '../scripts/trade.mjs';import {refreshTradeEditors} from '../scripts/ui-trade.mjs';
const errors=document.getElementById('errors');window.addEventListener('error',e=>errors.textContent+=e.message+'\n');window.addEventListener('unhandledrejection',e=>errors.textContent+=e.reason?.stack+'\n');
class App{
 constructor(options){this.options=options;this.rendered=false;}
 async render(){if(!this.element){this.element=document.createElement('section');this.element.className='application '+(this.constructor.DEFAULT_OPTIONS?.classes??[]).join(' ');this.element.style.width=(this.constructor.DEFAULT_OPTIONS?.position?.width??480)+'px';this.element.innerHTML='<header class="window-header"><h2 class="window-title"></h2><button type="button" aria-label="Close window">x</button></header><div class="window-content"></div>';this.element.querySelector('.window-header button').onclick=()=>this.close();document.body.append(this.element);}this.rendered=true;const html=await this._renderHTML();this._replaceHTML(html,this.element.querySelector('.window-content'));this.element.querySelector('.window-title').textContent=this.title??'';return this;}
 async close(options){this.rendered=false;this.element?.remove();this._onClose?.(options);return this;}bringToFront(){} _onClose(){}
}
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
globalThis.foundry={utils:{escapeHTML,deepClone:o=>structuredClone(o),getRoute:s=>s.startsWith('modules/kg-realms/')?'/'+s.slice(18):s,randomID:()=>crypto.randomUUID()},applications:{api:{ApplicationV2:App,DialogV2:{confirm:async()=>true}},ux:{TextEditor:{implementation:{enrichHTML:async s=>s}}}}};globalThis.TextEditor={enrichHTML:async s=>s};globalThis.ui={notifications:{info:console.info,warn:console.warn}};globalThis.game={user:{isGM:true,id:'gm'},scenes:new Map()};globalThis.canvas={scene:null};globalThis.fromUuidSync=()=>null;
const index=await(await fetch('../data/worlds/toril/index.json')).json(),places=['Neverwinter','Phandalin','Waterdeep'].map(name=>{const p=index.places.find(p=>p.name===name);return{...p,img:name==='Waterdeep'?'':`../assets/poi-img/${name}.webp`,summary:'A place on the Sword Coast. Existing descriptions, art and GM notes remain above the trade section.'};});
let edits={},scale='x1';const service=new TradeMarkets({load:async()=>await(await fetch('../data/worlds/toril/trade.json')).json(),getEdits:()=>edits,getScale:()=>scale,saveEdits:async(w,id,value,revision)=>{if(JSON.stringify(edits[id]??null)!==revision)throw Error('Trade changed while this editor was open. Reopen it before saving.');if(value==null)delete edits[id];else edits[id]=value;}});
const cards=new PlaceCards();registerKinds(cards,{realmPlaces:async()=>places,presetFor:async()=>null,trade:service,savePlaceEdit:async(w,id,v)=>Object.assign(places.find(p=>p.id===id),v),localMaps:{}});
const open=()=>cards.open({kind:'realm',world:'toril',id:places.find(p=>p.name===document.getElementById('place').value).id});await open();
document.getElementById('place').onchange=open;document.getElementById('theme').onchange=e=>document.body.className='kgr-theme-'+e.target.value;document.getElementById('scale').onchange=e=>{scale=e.target.value;hover.hide();cards.refresh();refreshTradeEditors();};document.getElementById('player').onchange=e=>{game.user.isGM=!e.target.checked;hover.hide();cards.refresh();};
const tip=document.getElementById('tooltip');document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tooltip]');if(!t)return;tip.innerHTML=t.dataset.tooltip;tip.hidden=false;const r=t.getBoundingClientRect();tip.style.left=Math.max(6,Math.min(innerWidth-tip.offsetWidth-6,r.x))+'px';tip.style.top=Math.max(6,r.y-tip.offsetHeight-8)+'px';});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tooltip]'))tip.hidden=true;});
const map=document.createElement('div');map.id='hover-map';map.style.cssText='position:fixed;inset:70px 0 0;z-index:0';document.body.prepend(map);
const stageHandlers=new Map();canvas.app={view:map};canvas.tokens={controlled:[]};canvas.stage={on:(k,f)=>stageHandlers.set(k,f),off:k=>stageHandlers.delete(k)};
const hover=new HoverCard({getPlace:id=>places.find(p=>p.id===id),getTrade:p=>service.get('toril',p),editTrade:p=>openTradeEditor({service,world:'toril',place:p,changed:()=>cards.refresh()}),openCard:id=>cards.open({kind:'realm',world:'toril',id}),hoverDelayMs:()=>50});
hover.attach({placeAt:p=>p.x<90&&p.y<300?places.find(p=>p.name===document.getElementById('place').value).id:null,frame:null});
map.addEventListener('pointermove',e=>stageHandlers.get('pointermove')?.({global:{x:e.clientX,y:e.clientY-70},client:e,getLocalPosition:()=>({x:e.clientX,y:e.clientY-70})}));
map.addEventListener('pointerleave',()=>stageHandlers.get('pointerleave')?.());
window.tradePreview={cards,service,places,hover,get edits(){return edits;},set edits(v){edits=v;}};
</script></body></html>
