<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KG Realms biome editor preview</title><link rel="stylesheet" href="../styles/realms.css"><style>
body{margin:0;background:#34493f;color:#eee;font:14px "Segoe UI",sans-serif}#board{position:fixed;inset:0;width:100%;height:100%}#scene-navigation{position:fixed;top:0;left:0;height:48px;right:0;background:#13171c;z-index:10000;display:flex;align-items:center;gap:12px;padding:0 12px}#scene-navigation label{display:flex;gap:8px;align-items:center}.kgr-ui :is(button,input,select){font:inherit;color:var(--kgr-text);background:var(--kgr-input);border:1px solid var(--kgr-line-2);border-radius:5px;padding:5px 7px}.kgr-ui button.primary{background:var(--kgr-accent);color:var(--kgr-gold-ink)}.kgr-ui .row{display:flex;flex-wrap:wrap;gap:8px}.kgr-ui label{min-width:0}.kgr-ui .hint{color:var(--kgr-muted-2)}#errors{position:fixed;bottom:0;left:0;background:#800;color:white;z-index:10000}
</style></head><body class="kgr-theme-iron"><canvas id="board" width="1366" height="1000"></canvas><div id="scene-navigation"><b>Biome editor preview</b><label>Theme<select id="theme"><option>iron</option><option>travel</option><option>oxblood</option><option>royal</option><option>emerald</option><option>amethyst</option><option>holy</option></select></label></div><pre id="errors"></pre><script type="module">
const errors=document.getElementById('errors');window.addEventListener('error',e=>errors.textContent+=e.message+'\n');window.addEventListener('unhandledrejection',e=>errors.textContent+=e.reason?.stack+'\n');
globalThis.foundry={utils:{getRoute:s=>s.replace(/^modules\/kg-realms\//,"/"),escapeHTML:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]),deepClone:o=>structuredClone(o),randomID:()=>crypto.randomUUID(),saveDataToFile:()=>{}},applications:{api:{DialogV2:{confirm:async()=>true}}}};
const settings={mapEditorX:900,mapEditorY:90,mapEditorLocked:false,mapEditorH:0};globalThis.game={user:{id:'gm',isGM:true,active:true},users:[{id:'gm',isGM:true,active:true}],settings:{get:(m,k)=>settings[k],set:async(m,k,v)=>settings[k]=v}};
globalThis.ui={notifications:{warn:console.warn,info:console.info}};globalThis.canvas={app:{view:document.getElementById('board')}};
let config={types:{},zones:{wood:{name:'Neverwinter Wood',type:'forest',pts:[[15,18],[42,16],[46,44],[20,48]],priority:0,overrides:{forage:18}}}},encounters={};
const rivers={r:{kind:'river',name:'River Never',pts:[[2,60],[30,56],[50,65],[70,48],[95,50]]}};
let overlay=[],nodes=[],water=[];
const layer={frame:{},toScreen:(x,y)=>[x*9,y*9+55],fromScreen:(x,y)=>[x/9,(y-55)/9],setBiomes:(z)=>{overlay=z??[];draw();},setRouteEdit:(line,n)=>{nodes=n??[];draw();},setEncounters:()=>draw(),setWaterways:()=>{},options:{}};
function draw(){const el=canvas.app.view,g=el.getContext('2d');g.clearRect(0,0,el.width,el.height);g.fillStyle='#435a4b';g.fillRect(0,0,el.width,el.height);g.strokeStyle='#526959';for(let x=0;x<el.width;x+=90){g.beginPath();g.moveTo(x,55);g.lineTo(x,el.height);g.stroke();}for(let y=55;y<el.height;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(el.width,y);g.stroke();}
for(const r of Object.values(rivers)){g.strokeStyle='#76c7e7';g.lineWidth=5;g.beginPath();r.pts.map(p=>layer.toScreen(...p)).forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke();}
for(const z of overlay){if(z.pts.length<2)continue;const p=z.pts.map(p=>layer.toScreen(...p));g.beginPath();p.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=(z.color??'#438253')+'55';g.fill();g.strokeStyle=z.color??'#438253';g.lineWidth=3;g.stroke();g.fillStyle='white';g.font='16px Segoe UI';g.fillText(z.name??'New zone',p[0][0]+10,p[0][1]+25);}
for(const n of nodes){const p=layer.toScreen(...n);g.fillStyle='#ffc94a';g.beginPath();g.arc(...p,5,0,7);g.fill();}
for(const e of Object.values(encounters)){const p=layer.toScreen(e.lon,e.lat);g.fillStyle='#69c5ea';g.beginPath();g.arc(...p,8,0,7);g.fill();g.fillStyle='white';g.fillText(e.name,p[0]+12,p[1]);}}
const {BiomeEditor}=await import('../scripts/ui-biomes.mjs'),{RoadEditor}=await import('../scripts/ui-roads.mjs'),{MapEditor}=await import('../scripts/ui-editor.mjs');
const biomes=new BiomeEditor({getLayer:()=>layer,getTerrain:async()=>{const img=await createImageBitmap(await(await fetch("../data/worlds/toril/terrain.png")).blob()),c=new OffscreenCanvas(img.width,img.height),g=c.getContext("2d");g.drawImage(img,0,0);const rgba=g.getImageData(0,0,img.width,img.height).data,data=Uint8Array.from({length:img.width*img.height},(_,i)=>rgba[i*4]);return{data,width:img.width,height:img.height,cell:4};},getBiomes:()=>config,saveBiomes:async fn=>{config=fn(structuredClone(config));}});
const empty={features:[]},roads=new RoadEditor({getLayer:()=>layer,getRoutes:()=>empty,getBase:()=>empty,getPlaces:()=>[],getEdits:()=>({}),saveEdits:async()=>{},getEncounters:()=>encounters,saveEncounters:async fn=>{encounters=fn(structuredClone(encounters));layer.setEncounters(encounters);},getWaterways:()=>rivers});
const editor=new MapEditor({biomes,roads});editor.tab='biomes';await editor.open();
document.getElementById('theme').onchange=e=>document.body.className='kgr-theme-'+e.target.value;
draw();window.biomePreview={editor,biomes,roads,layer,get config(){return config;},get encounters(){return encounters;},rivers};
</script></body></html>
